name: Deploy SIMON SATUPUTARU to Hostinger

on:
  push:
    branches:
      - main  # Trigger otomatis setiap push ke branch main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 3. Install Dependencies
        run: npm ci

      - name: 🏗️ 4. Build Production Bundle
        run: npm run build

      - name: 🌐 5. Update production branch for Hostinger Git
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          force_orphan: true

      - name: 🚀 6. Deploy via FTP (Optional jika Secrets FTP diisi)
        if: "${{ env.FTP_SERVER != '' }}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
          dangerous-clean-slate: false
